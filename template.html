<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frido GT Field Intelligence — Apr–Aug 2026</title>
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0E1B2E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
/* set the theme before first paint so the page never flashes the wrong mode */
(function(){try{var t=localStorage.getItem('frido-theme');
  if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
</script>
<style>
:root{
  color-scheme:light;

  /* ═══════════ FRIDO BRAND — the only block to edit to match brand colour ═══════════
     Replace these three with the official Frido hexes. Everything else on the page
     derives from them or from the validated data-viz roles below.                  */
  --brand-ink:#0E1B2E;      /* deep navy — masthead, hero tile           */
  --brand:#0F7D52;          /* Frido green — active states, primary rule */
  --brand-warm:#E2673C;     /* coral — focus rings, accent hairline      */
  /* ══════════════════════════════════════════════════════════════════════════════ */

  /* surfaces & ink */
  --paper:#F7F6F3; --card:#FFFFFF; --rule:#E4E3DD; --rule-soft:#EFEEE9;
  --ink:#141A21; --muted:#5C6670; --faint:#8B939B;
  --track:#ECEBE6;
  --shadow:0 1px 2px rgba(14,27,46,.05), 0 1px 8px rgba(14,27,46,.04);

  /* data-viz roles — validated light steps (see README § Colour) */
  --gain:#0F7D52; --gain-b:#E2EFE9; --gain-on:#FFFFFF;
  --loss:#B03A22; --loss-b:#F8E6E1; --loss-on:#FFFFFF;
  --cool:#2F72BC; --cool-b:#E5ECF6; --cool-on:#FFFFFF;
  --warn:#CE8C00; --warn-b:#FAF0DA; --warn-on:#2A1E00;
  --neut:#B7BEC5; --neut-b:#F0F1F2; --neut-on:#1B2026;
  --seq:#2F72BC;            /* sequential hue — category × region matrix */

  /* Same-category ribbon segments alternate between two shades so a run of them
     stays readable; the 2px surface gap does the rest of the separating.
     Deliberately ONE step, not a ramp: deeper steps push the label contrast of
     at least one role under 4.5:1 in one of the two themes. */
  --t0:1; --t1:.92;

  --disp:'Plus Jakarta Sans',system-ui,sans-serif;
  --body:'Plus Jakarta Sans',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}

/* Dark steps are selected for the dark surface, not flipped from light.
   Declared under both scopes: the media query follows the OS, the data-theme
   scope lets the in-page toggle win in either direction. */
@media(prefers-color-scheme:dark){
  :root:where(:not([data-theme="light"])){
    color-scheme:dark;
    --brand-ink:#0A1220; --brand:#2CA277; --brand-warm:#F0805A;
    --paper:#0D1117; --card:#151A21; --rule:#252D38; --rule-soft:#1C232C;
    --ink:#EAEEF2; --muted:#9AA5B1; --faint:#6E7A87;
    --track:#222A34;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 1px 8px rgba(0,0,0,.25);
    --gain:#2CA277; --gain-b:#122A22; --gain-on:#08130E;
    --loss:#DE6244; --loss-b:#2E1913; --loss-on:#1A0A05;
    --cool:#5497DE; --cool-b:#16202E; --cool-on:#06101E;
    --warn:#C98500; --warn-b:#2A1F08; --warn-on:#1C1200;
    --neut:#5A646E; --neut-b:#1B222A; --neut-on:#EAEEF2;
    --seq:#5497DE;
    --t0:1; --t1:1.07;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --brand-ink:#0A1220; --brand:#2CA277; --brand-warm:#F0805A;
  --paper:#0D1117; --card:#151A21; --rule:#252D38; --rule-soft:#1C232C;
  --ink:#EAEEF2; --muted:#9AA5B1; --faint:#6E7A87;
  --track:#222A34;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 1px 8px rgba(0,0,0,.25);
  --gain:#2CA277; --gain-b:#122A22; --gain-on:#08130E;
  --loss:#DE6244; --loss-b:#2E1913; --loss-on:#1A0A05;
  --cool:#5497DE; --cool-b:#16202E; --cool-on:#06101E;
  --warn:#C98500; --warn-b:#2A1F08; --warn-on:#1C1200;
  --neut:#5A646E; --neut-b:#1B222A; --neut-on:#EAEEF2;
  --seq:#5497DE;
  --t0:1; --t1:1.07;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;
  transition:background-color .18s ease,color .18s ease}
h1,h2,h3{font-family:var(--disp);font-weight:700;margin:0;letter-spacing:-.018em}
a{color:inherit}
.mono{font-family:var(--mono)}

/* ---------- layout ----------
   Sidebar is fixed and the content shell is offset by its width, so the long
   tables scroll under their own steam without dragging the nav with them. The
   width lives in one variable because the rail, the drawer and the content
   offset must always agree. */
:root{--side-w:236px; --rail-w:64px}
:root[data-side="rail"]{--side-w:var(--rail-w)}
.shell{margin-left:var(--side-w);transition:margin-left .18s ease;min-width:0}
main{padding:26px 26px 70px;max-width:1280px}
footer{padding:20px 26px 40px;max-width:1280px}
.skip{position:absolute;left:-9999px;top:0;background:var(--card);color:var(--ink);
  padding:10px 14px;border:1px solid var(--rule);border-radius:0 0 6px 0;z-index:80}
.skip:focus{left:0}

/* ---------- sidebar ---------- */
.side{position:fixed;inset:0 auto 0 0;width:var(--side-w);z-index:50;
  background:var(--card);border-right:1px solid var(--rule);
  display:flex;flex-direction:column;transition:width .18s ease,transform .18s ease}
/* the brand hairline, now running down the sidebar's edge */
.side::after{content:"";position:absolute;inset:0 -1px 0 auto;width:3px;
  background:linear-gradient(180deg,var(--brand) 0%,var(--brand) 38%,var(--brand-warm) 100%)}
.side-head{display:flex;align-items:center;gap:11px;padding:16px 14px 14px;
  border-bottom:1px solid var(--rule);min-height:62px}
.side-title{min-width:0;flex:1;overflow:hidden}
.side-head h1{font-size:16px;letter-spacing:-.02em;font-weight:800;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.side-head .sub{display:block;font-family:var(--mono);font-size:9.5px;color:var(--muted);
  text-transform:uppercase;letter-spacing:.08em;white-space:nowrap;margin-top:2px;
  overflow:hidden;text-overflow:ellipsis}
/* brand mark — the Frido "f" in a rounded tile */
.mark{width:30px;height:30px;border-radius:9px;flex:none;display:grid;place-items:center;
  background:var(--brand);color:#fff;font-family:var(--disp);font-weight:800;
  font-size:17px;line-height:1;letter-spacing:-.04em;box-shadow:var(--shadow)}

nav{display:flex;flex-direction:column;gap:1px;padding:10px 8px;overflow-y:auto;flex:1;
  scrollbar-width:thin}
nav button{display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  font-family:var(--body);font-size:13.5px;font-weight:500;letter-spacing:-.005em;
  background:none;border:0;border-radius:8px;color:var(--muted);
  padding:9px 10px;cursor:pointer;white-space:nowrap;position:relative;
  transition:color .13s,background .13s}
nav button svg{width:18px;height:18px;flex:none}
nav button:hover{color:var(--ink);background:var(--rule-soft)}
nav button[aria-selected="true"]{color:var(--ink);background:var(--gain-b);font-weight:600}
nav button[aria-selected="true"]::before{content:"";position:absolute;left:-8px;top:7px;bottom:7px;
  width:3px;border-radius:0 3px 3px 0;background:var(--brand)}
nav button[aria-selected="true"] svg{color:var(--brand)}
nav button:focus-visible{outline:2px solid var(--brand-warm);outline-offset:-2px}

.side-foot{display:flex;align-items:center;gap:10px;padding:11px 14px;
  border-top:1px solid var(--rule)}
.side-foot-t{font-family:var(--mono);font-size:9.5px;color:var(--faint);
  text-transform:uppercase;letter-spacing:.07em;white-space:nowrap;overflow:hidden}

/* collapsed rail: labels and chrome fold away, icons stay centred */
.side-collapse svg{transition:transform .18s ease}
:root[data-side="rail"] .side-title,
:root[data-side="rail"] .side-foot-t{display:none}
:root[data-side="rail"] .side-head{justify-content:center;padding:16px 0 14px;gap:0}
:root[data-side="rail"] .side-collapse{position:absolute;right:-13px;top:20px;z-index:2;
  background:var(--card);border:1px solid var(--rule)}
:root[data-side="rail"] .side-collapse svg{transform:rotate(180deg)}
:root[data-side="rail"] nav button{justify-content:center;padding:10px 0}
:root[data-side="rail"] nav button .lbl{display:none}
:root[data-side="rail"] .side-foot{justify-content:center;padding:11px 0}

/* ---------- buttons ---------- */
.icon-btn{display:grid;place-items:center;width:32px;height:32px;flex:none;cursor:pointer;
  background:var(--card);border:1px solid var(--rule);border-radius:8px;color:var(--muted);
  padding:0;transition:color .15s,border-color .15s,background .15s}
.icon-btn:hover{color:var(--ink);border-color:var(--faint)}
.icon-btn:focus-visible{outline:2px solid var(--brand-warm);outline-offset:2px}
.icon-btn svg{width:17px;height:17px;display:block}
.side-collapse{border-color:transparent;background:none}
/* one icon per mode — the sun shows in dark mode (click to go light) and vice versa */
.theme-btn .i-moon{display:block} .theme-btn .i-sun{display:none}
:root[data-theme="dark"] .theme-btn .i-moon{display:none}
:root[data-theme="dark"] .theme-btn .i-sun{display:block}
@media(prefers-color-scheme:dark){
  :root:where(:not([data-theme="light"])) .theme-btn .i-moon{display:none}
  :root:where(:not([data-theme="light"])) .theme-btn .i-sun{display:block}
}

/* ---------- narrow: sidebar becomes a drawer ---------- */
.topbar{display:none}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:46;border:0}
@media(max-width:860px){
  :root{--side-w:0px}
  .topbar{display:flex;align-items:center;gap:11px;padding:10px 14px;position:sticky;top:0;z-index:44;
    background:var(--card);border-bottom:1px solid var(--rule)}
  .topbar b{font-family:var(--disp);font-size:15px;font-weight:800;letter-spacing:-.02em}
  .topbar-sp{margin-left:auto}
  .shell{margin-left:0}
  main{padding:20px 16px 60px}
  footer{padding:18px 16px 36px}
  /* off-canvas until opened; the rail state is a desktop affordance only */
  .side{width:264px;transform:translateX(-100%);box-shadow:none}
  :root[data-drawer="open"] .side{transform:none;box-shadow:0 0 40px rgba(0,0,0,.25)}
  :root[data-side="rail"] .side{width:264px}
  :root[data-side="rail"] .side-title,
  :root[data-side="rail"] .side-foot-t{display:block}
  :root[data-side="rail"] .side-head{justify-content:flex-start;padding:16px 14px 14px;gap:11px}
  :root[data-side="rail"] nav button{justify-content:flex-start;padding:9px 10px}
  :root[data-side="rail"] nav button .lbl{display:inline}
  :root[data-side="rail"] .side-foot{justify-content:flex-start;padding:11px 14px}
  .side-collapse{display:none}
}
@media(min-width:861px){ .scrim{display:none} }
.panel[hidden]{display:none}
section{margin-bottom:34px}
.shead{display:flex;align-items:baseline;gap:12px;margin-bottom:13px;
  border-bottom:1px solid var(--rule);padding-bottom:7px;flex-wrap:wrap}
.shead h2{font-size:15px;letter-spacing:.01em}
.shead .note{font-size:12.5px;color:var(--muted)}

/* ---------- cards ---------- */
.card{background:var(--card);border:1px solid var(--rule);border-radius:3px;padding:16px 18px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.g5{grid-template-columns:repeat(5,1fr)}

/* ---------- kpi ---------- */
.kpi{background:var(--card);border:1px solid var(--rule);border-radius:3px;padding:13px 15px 14px}
.kpi .lab{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);display:block;margin-bottom:5px}
.kpi .val{font-family:var(--disp);font-size:32px;font-weight:800;line-height:1;
  letter-spacing:-.035em;font-variant-numeric:tabular-nums}
.kpi .val .u{font-size:15px;font-weight:500;color:var(--muted);margin-left:2px}
.kpi .fo{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.35}
.kpi.hero{background:var(--brand-ink);border-color:var(--brand-ink);color:#fff;
  background-image:linear-gradient(135deg,var(--brand-ink) 0%,color-mix(in srgb,var(--brand-ink) 82%,var(--brand)) 100%)}
.kpi.hero .lab{color:#9DB3C4}
.kpi.hero .fo{color:#B4C4D2}

/* ---------- signature: conversion ribbon ---------- */
.ribbon-wrap{background:var(--card);border:1px solid var(--rule);border-radius:3px;padding:18px 18px 15px}
.ribbon{display:flex;height:60px;width:100%;border-radius:2px;overflow:hidden;
  border:1px solid var(--rule)}
.ribbon div{position:relative;transition:filter .15s}
.ribbon div:hover{filter:brightness(1.12)}
.ribbon .seg-label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.03em;
  pointer-events:none;padding:0 4px;overflow:hidden}
.ribbon-key{display:flex;flex-wrap:wrap;gap:5px 20px;margin-top:13px}
.ribbon-key span{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:7px}
.ribbon-key i{width:11px;height:11px;border-radius:2px;display:inline-block;flex:none}
.ribbon-cap{font-size:12.5px;color:var(--muted);margin-top:11px;
  border-top:1px solid var(--rule);padding-top:11px;max-width:66ch}

/* ---------- bars ---------- */
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:minmax(112px,auto) 1fr minmax(56px,auto);
  gap:11px;align-items:center;font-size:13px}
.bar .nm{color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .tr{background:var(--track);height:15px;border-radius:2px;overflow:hidden}
.bar .fl{height:100%;background:var(--cool);border-radius:2px}
.bar .vv{font-family:var(--mono);font-size:12px;text-align:right;font-variant-numeric:tabular-nums}
.fl.gain{background:var(--gain)} .fl.loss{background:var(--loss)}
.fl.warn{background:var(--warn)} .fl.cool{background:var(--cool)}

/* ---------- tables ---------- */
.tbl-scroll{overflow-x:auto;border:1px solid var(--rule);border-radius:3px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted);text-align:left;padding:9px 11px;border-bottom:1px solid var(--rule);
  white-space:nowrap;background:var(--card);position:sticky;top:0;font-weight:500}
td{padding:8px 11px;border-bottom:1px solid var(--rule-soft);white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--rule-soft)}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:12px}
td.nm{font-weight:500;max-width:230px;overflow:hidden;text-overflow:ellipsis}
.sortable{cursor:pointer;user-select:none}
.sortable:hover{color:var(--ink)}
.pill{font-family:var(--mono);font-size:10.5px;padding:2px 6px;border-radius:2px;
  background:#EDEEEA;color:var(--muted)}
.pill.g{background:var(--gain-b);color:var(--gain)}
.pill.l{background:var(--loss-b);color:var(--loss)}
.pill.w{background:var(--warn-b);color:var(--warn)}

/* ---------- matrix ---------- */
.matrix td.cell{text-align:right;font-family:var(--mono);font-size:12px;position:relative;
  font-variant-numeric:tabular-nums}
.matrix td.cell .bg{position:absolute;inset:2px;border-radius:2px;background:var(--seq);opacity:0}
/* magnitude is sequential — one hue, light to dark. Never the status green. */
.matrix td.cell span{position:relative}

/* ---------- callout ---------- */
.callout{border-left:3px solid var(--loss);background:var(--loss-b);
  padding:12px 15px;border-radius:0 3px 3px 0;font-size:13.5px;line-height:1.55}
.callout.w{border-color:var(--warn);background:var(--warn-b)}
.callout.g{border-color:var(--gain);background:var(--gain-b)}
.callout.c{border-color:var(--cool);background:var(--cool-b)}
.callout b{font-weight:600}

/* ---------- misc ---------- */
.stat-row{display:flex;gap:26px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.stat-row b{font-family:var(--disp);font-size:20px;color:var(--ink);font-weight:800;
  display:block;letter-spacing:-.03em}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:13px}
.filters label{font-family:var(--mono);font-size:10px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--muted)}
select,input[type=search]{font-family:var(--body);font-size:13px;padding:6px 9px;
  border:1px solid var(--rule);border-radius:3px;background:var(--card);color:var(--ink)}
select:focus-visible,input:focus-visible{outline:2px solid var(--cool);outline-offset:1px}
.sm{font-size:12.5px;color:var(--muted)}

/* ---------- csv button ---------- */
.filters .csv{margin-left:auto;display:inline-flex;align-items:center;gap:6px;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
  background:var(--card);border:1px solid var(--rule);border-radius:6px;color:var(--muted);
  padding:5px 10px;cursor:pointer;transition:color .15s,border-color .15s}
.filters .csv:hover{color:var(--ink);border-color:var(--faint)}
.filters .csv:focus-visible{outline:2px solid var(--brand-warm);outline-offset:2px}
.filters .csv svg{width:13px;height:13px;flex:none}

/* ---------- kpi delta ---------- */
.kpi .delta{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);
  font-size:11px;font-weight:500;padding:2px 6px;border-radius:4px;margin-top:7px;
  font-variant-numeric:tabular-nums}
.kpi .delta.up{background:var(--gain-b);color:var(--gain)}
.kpi .delta.down{background:var(--loss-b);color:var(--loss)}
.kpi .delta.flat{background:var(--neut-b);color:var(--muted)}
.kpi.hero .delta{background:rgba(255,255,255,.14);color:#fff}
.kpi .delta .arw{font-size:12px;line-height:1}
.kpi .basis{display:block;font-size:11px;color:var(--faint);margin-top:5px}
.kpi.hero .basis{color:#93A7B8}

/* ---------- segment chips ---------- */
.segs{display:flex;flex-wrap:wrap;gap:8px}
.seg-chip{display:flex;align-items:center;gap:8px;border:1px solid var(--rule);
  border-radius:7px;padding:9px 13px;background:var(--card);flex:1 1 160px}
.seg-chip i{width:10px;height:10px;border-radius:3px;flex:none}
.seg-chip b{font-family:var(--disp);font-size:19px;font-weight:800;letter-spacing:-.03em;
  display:block;line-height:1.1}
.seg-chip .t{font-size:12.5px;color:var(--muted)}
.spark{display:flex;align-items:flex-end;gap:3px;height:34px}
.spark i{flex:1;background:var(--cool);border-radius:1px 1px 0 0;min-height:2px;display:block}
footer{border-top:1px solid var(--rule);padding:20px 0 40px;font-size:12.5px;color:var(--muted)}

@media(max-width:900px){
  .g5,.g4{grid-template-columns:repeat(2,1fr)}
  .g3,.g2{grid-template-columns:1fr}
  .kpi .val{font-size:26px}
  .ribbon{height:46px}
  .bar{grid-template-columns:minmax(88px,auto) 1fr minmax(48px,auto);font-size:12.5px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{nav,.filters{display:none}.panel[hidden]{display:block!important}}
</style>
</head>
<body>

<a class="skip" href="#main">Skip to content</a>

<!-- slim bar, only present below the sidebar breakpoint -->
<div class="topbar">
  <button class="icon-btn" id="drawerBtn" type="button" aria-label="Open sections"
          aria-expanded="false" aria-controls="side">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
         stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
  <span class="mark" aria-hidden="true">f</span>
  <b>Frido GT</b>
  <span class="topbar-sp"></span>
  <button class="icon-btn theme-btn" id="themeBtnTop" type="button"
          aria-label="Switch between light and dark theme"></button>
</div>
<div class="scrim" id="scrim" hidden></div>

<aside class="side" id="side">
  <div class="side-head">
    <span class="mark" aria-hidden="true">f</span>
    <div class="side-title">
      <h1>Frido GT</h1>
      <span class="sub" id="scope"></span>
    </div>
    <button class="icon-btn side-collapse" id="collapseBtn" type="button"
            aria-label="Collapse the sidebar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M15 5.5 8.5 12l6.5 6.5"/>
      </svg>
    </button>
  </div>

  <nav role="tablist" aria-orientation="vertical" aria-label="Dashboard sections" id="nav"></nav>

  <div class="side-foot">
    <button class="icon-btn theme-btn" id="themeBtn" type="button"
            aria-label="Switch between light and dark theme"></button>
    <span class="side-foot-t" id="asof"></span>
  </div>
</aside>

<div class="shell">
  <main id="main" tabindex="-1"></main>
  <footer>
    <div>Built from FieldAssist exports — Secondary Order Dump, Outlet Dump GeoHierarchy, Employee Productivity, Attendance, Beat Visit Coverage, and the Users and Beats masters. Figures cover general trade only.</div>
  </footer>
</div>

<template id="themeIcons">
  <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
       stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
  </svg>
  <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor"
       stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <circle cx="12" cy="12" r="4.2"/>
    <path d="M12 2v2.4M12 19.6V22M2 12h2.4M19.6 12H22M4.9 4.9l1.7 1.7M17.4 17.4l1.7 1.7M19.1 4.9l-1.7 1.7M6.6 17.4l-1.7 1.7"/>
  </svg>
</template>

<script>
const D = /*__DATA__*/;

/* ---------------- helpers ---------------- */
const ICON_DL = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
  stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v11"/>
  <path d="m7.5 10 4.5 4.5 4.5-4.5"/><path d="M4 19h16"/></svg>`;
const inr = n => {
  n = Number(n)||0;
  if (Math.abs(n) >= 1e7) return (n/1e7).toFixed(2) + ' Cr';
  if (Math.abs(n) >= 1e5) return (n/1e5).toFixed(1) + ' L';
  if (Math.abs(n) >= 1e3) return (n/1e3).toFixed(1) + 'k';
  return Math.round(n).toString();
};
const cm = n => (Number(n)||0).toLocaleString('en-IN');
const pc = n => (Number(n)||0).toFixed(1) + '%';
const el = (t, c, h) => { const e = document.createElement(t); if(c) e.className = c; if(h!=null) e.innerHTML = h; return e; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function kpi(lab, val, unit, foot, hero, trend){
  return `<div class="kpi${hero?' hero':''}"><span class="lab">${lab}</span>
    <div class="val">${val}${unit?`<span class="u">${unit}</span>`:''}</div>
    ${foot?`<div class="fo">${foot}</div>`:''}
    ${trend||''}</div>`;
}

/* ---------------- month-on-month trend ----------------
   The last month of a FieldAssist pull is normally mid-month — this one ends on
   the 13th — so comparing it against a full month reads as a collapse that never
   happened. Identify short months by field-days per active rep (a partial month
   is short on days but not on people) and trend the last two COMPLETE months
   instead, naming the basis on the tile so the comparison is never implied.   */
const TREND = (() => {
  const ms = (D.monthly||[]).filter(m => m.days > 0 && m.users > 0);
  if (ms.length < 2) return null;
  const dpu = m => m.days / m.users;
  const sorted = ms.map(dpu).sort((a,b) => a-b);
  const med = sorted[Math.floor(sorted.length/2)];
  const full = ms.filter(m => dpu(m) >= med * 0.6);
  if (full.length < 2) return null;
  return {
    cur: full[full.length-1], prev: full[full.length-2],
    partial: ms.filter(m => dpu(m) < med * 0.6).map(m => m.month),
  };
})();
const mon3 = s => String(s||'').slice(0,3);

/* pp:true reports a percentage-POINT move — the percent change OF a percentage
   ("conversion fell 1.5%") is a number nobody can act on. */
function trend(key, opts){
  if (!TREND) return '';
  const o = opts||{};
  const a = Number(TREND.prev[key]), b = Number(TREND.cur[key]);
  if (!isFinite(a) || !isFinite(b) || (!o.pp && a === 0)) return '';
  const diff = o.pp ? (b - a) : (b - a) / Math.abs(a) * 100;
  const good = o.lowerIsBetter ? -diff : diff;
  const flat = Math.abs(diff) < (o.pp ? 0.15 : 1);
  const cls = flat ? 'flat' : (good > 0 ? 'up' : 'down');
  const arw = flat ? '→' : (diff > 0 ? '↑' : '↓');
  const txt = (diff > 0 ? '+' : diff < 0 ? '−' : '') +
    Math.abs(diff).toFixed(1) + (o.pp ? ' pp' : '%');
  return `<span class="delta ${cls}"><span class="arw">${arw}</span>${txt}</span>
    <span class="basis">${mon3(TREND.cur.month)} vs ${mon3(TREND.prev.month)}</span>`;
}
function barList(rows, cls, fmt){
  const max = Math.max(...rows.map(r => r.v), 1);
  return `<div class="bars">` + rows.map(r => `
    <div class="bar"><div class="nm" title="${esc(r.k)}">${esc(r.k)}</div>
      <div class="tr"><div class="fl ${cls||'cool'}" style="width:${(r.v/max*100).toFixed(1)}%"></div></div>
      <div class="vv">${fmt?fmt(r.v):cm(r.v)}</div></div>`).join('') + `</div>`;
}
function table(cols, rows, id){
  const head = cols.map((c,i) => `<th class="${c.n?'n':''} ${c.sort!==false?'sortable':''}" data-i="${i}">${c.t}</th>`).join('');
  const body = rows.map(r => `<tr>` + r.map((v,i) =>
    `<td class="${cols[i].n?'n':''} ${cols[i].nm?'nm':''}">${v}</td>`).join('') + `</tr>`).join('');
  return `<div class="tbl-scroll"><table${id?` id="${id}"`:''}><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
}

/* ---------------- shared filter state ----------------
   Filters keyed on one of these stick across tabs and ride in the URL, so
   picking "West" once holds everywhere and the link you send carries it.
   Anything else (free-text search, table-specific selects) stays local to its
   table — sharing a half-typed search box across tabs would be noise.        */
const STICKY_KEYS = new Set(['zone','month','manager','seg']);
const STICKY = {};

function readHash(){
  const h = location.hash.replace(/^#/, '');
  if (!h) return {};
  return Object.fromEntries(h.split('&').filter(Boolean).map(p => {
    const i = p.indexOf('=');
    return i < 0 ? [decodeURIComponent(p), ''] : [decodeURIComponent(p.slice(0,i)), decodeURIComponent(p.slice(i+1))];
  }));
}
let HASH_LOCK = false;   /* set while we write, so our own write is not read back */
function writeHash(tab){
  const parts = ['tab=' + encodeURIComponent(tab)];
  Object.keys(STICKY).sort().forEach(k => {
    if (STICKY[k]) parts.push(encodeURIComponent(k) + '=' + encodeURIComponent(STICKY[k]));
  });
  const next = '#' + parts.join('&');
  if (next === location.hash) return;
  HASH_LOCK = true;
  /* replaceState keeps the back button clean, but it throws on opaque origins
     (about:blank, some sandboxes). The URL is a convenience, never a dependency,
     so fall back and then give up rather than take the page down with it. */
  try { history.replaceState(null, '', next); }
  catch (e) { try { location.hash = next; } catch (e2) {} }
  setTimeout(() => { HASH_LOCK = false; }, 0);
}

/* ---------------- filterable / sortable table ----------------
   cols:    [{t, key, n, nm, fmt, sort:false, csv}]
   filters: [{id, label, key, type:'select'|'search', all, ph}]
   A filter whose key is in STICKY_KEYS is shared; the rest are local.        */
const FT = {}, FTW = {};
function ftable(id, cfg){
  FT[id] = cfg;
  cfg.sort = cfg.sort || {};
  const bar = (cfg.filters||[]).map(f => f.type === 'search'
    ? `<label for="${id}-${f.id}">${f.label}</label>
       <input type="search" id="${id}-${f.id}" placeholder="${f.ph||''}">`
    : `<label for="${id}-${f.id}">${f.label}</label>
       <select id="${id}-${f.id}"><option value="">${f.all||'All'}</option>${
         [...new Set(cfg.rows.map(r => r[f.key]))]
           .filter(v => v !== '' && v != null).sort()
           .map(v => `<option>${esc(v)}</option>`).join('')}</select>`).join('');
  return `<div class="filters">${bar}<span class="sm" id="${id}-n"></span>
      <button type="button" class="csv" id="${id}-csv"
              title="Download these rows as CSV">${ICON_DL} CSV</button>
    </div>
    <div id="${id}-t"></div>`;
}
function ftableWire(id){
  if (FTW[id] || !document.getElementById(id+'-t')) return;
  FTW[id] = 1;
  (FT[id].filters||[]).forEach(f => {
    const e = document.getElementById(`${id}-${f.id}`);
    if (!e) return;
    /* a shared filter opens on whatever the rest of the dashboard is showing */
    if (STICKY_KEYS.has(f.key) && STICKY[f.key] != null) e.value = STICKY[f.key];
    e[f.type === 'search' ? 'oninput' : 'onchange'] = () => {
      if (STICKY_KEYS.has(f.key)) { STICKY[f.key] = e.value; syncSticky(); }
      else ftableDraw(id);
    };
  });
  const dl = document.getElementById(id+'-csv');
  if (dl) dl.onclick = () => downloadCSV(id);
  ftableDraw(id);
}
/* push the shared values into every wired table, then redraw them all */
function syncSticky(){
  Object.keys(FT).forEach(tid => {
    if (!FTW[tid]) return;
    (FT[tid].filters||[]).forEach(f => {
      if (!STICKY_KEYS.has(f.key)) return;
      const e = document.getElementById(`${tid}-${f.id}`);
      /* only if this table offers that value — tables cover different row sets */
      if (e && [...e.options].some(o => o.value === (STICKY[f.key]||''))) e.value = STICKY[f.key] || '';
    });
    ftableDraw(tid);
  });
  writeHash(CURRENT_TAB);
}
function ftableRows(id){
  const cfg = FT[id];
  let rows = cfg.rows.slice();
  (cfg.filters||[]).forEach(f => {
    const e = document.getElementById(`${id}-${f.id}`);
    if (!e || !e.value) return;
    const v = e.value.toLowerCase();
    rows = f.type === 'search'
      ? rows.filter(r => String(r[f.key]||'').toLowerCase().includes(v))
      : rows.filter(r => String(r[f.key]).toLowerCase() === v);
  });
  const s = cfg.sort;
  if (s.key) rows.sort((a,b) => {
    const x = a[s.key], y = b[s.key];
    const v = (typeof x === 'number' && typeof y === 'number')
      ? y - x : String(y).localeCompare(String(x));
    return s.dir === 'asc' ? -v : v;
  });
  return rows;
}
function ftableDraw(id){
  const cfg = FT[id];
  const rows = ftableRows(id);
  const n = document.getElementById(id+'-n');
  if (n) n.textContent = rows.length + (cfg.limit && rows.length > cfg.limit
    ? ` matched · top ${cfg.limit} shown` : ' shown');
  const view = cfg.limit ? rows.slice(0, cfg.limit) : rows;
  document.getElementById(id+'-t').innerHTML = view.length
    ? table(cfg.cols.map(c => ({t:c.t, n:c.n, nm:c.nm, sort: !!(c.key && c.sort !== false)})),
            view.map(r => cfg.cols.map(c => c.fmt ? c.fmt(r[c.key], r) : esc(r[c.key] ?? ''))),
            id+'-tbl')
    : `<div class="card sm">Nothing matches that filter.</div>`;
  document.querySelectorAll(`#${id}-tbl th`).forEach((th,i) => {
    const c = cfg.cols[i];
    if (!c.key || c.sort === false) { th.classList.remove('sortable'); return; }
    th.onclick = () => {
      const s = cfg.sort;
      if (s.key === c.key) s.dir = s.dir === 'asc' ? 'desc' : 'asc';
      else { s.key = c.key; s.dir = 'desc'; }
      ftableDraw(id);
    };
  });
}

/* ---------------- CSV export ----------------
   Exports what is on screen — current filters, current sort, every matching row
   even when the view is capped. Raw values, not the formatted HTML: a sales-ops
   sheet wants 1276003, not "₹12.8 L".                                        */
function csvCell(v){
  if (v == null) return '';
  const s = String(v);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
}
/* kept separate from the download so the content can be asserted in tests */
function csvFor(id){
  const cfg = FT[id], rows = ftableRows(id);
  const cols = cfg.cols.filter(c => c.key);
  const head = cols.map(c => csvCell(c.t)).join(',');
  const body = rows.map(r => cols.map(c => csvCell(r[c.key])).join(',')).join('\n');
  return head + '\n' + body;
}
function downloadCSV(id){
  /* BOM so Excel opens the rupee sign and Indian names as UTF-8 */
  const blob = new Blob(['﻿' + csvFor(id)], {type:'text/csv;charset=utf-8;'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `frido-${id}-${(D.rfm && D.rfm.as_of || 'export').replace(/ /g,'-')}.csv`;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 0);
}

/* ---------------- signature ribbon ----------------
   Colour encodes the reason CATEGORY, so the eye groups causes not ranks.
   Each category maps to a themed role token rather than a literal hex, so the
   ribbon re-colours with the theme without a re-render.

   ROLE_ORDER is a CVD-safety mechanism, not cosmetic: segments are sorted into
   this order so the two warm hues (loss/rust and warn/amber) are never adjacent.
   That adjacency is the one pair that fails the dark-mode separation gate.
   Re-run scripts/validate_palette.js before changing it.                      */
const CAT_ROLE = {
  'SHOP RELATED ISSUE':'loss',
  'COMPANY RELATED ISSUE':'cool',
  'DISTRIBUTOR RELATED ISSUE':'cool',
  'PRODUCT RELATED ISSUE':'cool',
  'COMPETITOR RELATED ISSUE':'warn',
  'MORE FACTORS':'neut',
  'Not recorded':'neut'
};
const ROLE_ORDER = ['gain','loss','cool','warn','neut'];

function ribbon(){
  const total = D.kpis.tc, pcv = D.kpis.pc;
  const top = D.nosale.by_reason.slice(0,7);
  const named = top.reduce((a,b) => a + b.n, 0);
  const other = D.nosale.total - named;

  let segs = [{k:'Order placed', n:pcv, role:'gain', g:'Converted'}]
    .concat(top.map(r => ({k:r.name, n:r.n, role:CAT_ROLE[r.cat] || 'neut', g:r.cat})))
    .concat(other > 0 ? [{k:'All other reasons', n:other, role:'neut', g:'Mixed'}] : []);

  /* group by role in the validated order, biggest first inside each group */
  segs.sort((a,b) => ROLE_ORDER.indexOf(a.role) - ROLE_ORDER.indexOf(b.role) || b.n - a.n);
  const shade = {};
  segs.forEach(s => { shade[s.role] = (shade[s.role]||0) + 1; s.tint = shade[s.role]-1; });

  const fill = s => `background:var(--${s.role});filter:brightness(var(--t${s.tint % 2}))`;
  return `<div class="ribbon-wrap">
    <div class="ribbon">${segs.map((s,i) => {
      const w = s.n/total*100;
      return `<div style="width:${w.toFixed(2)}%;${fill(s)}${i < segs.length-1 ? ';box-shadow:inset -2px 0 0 var(--card)' : ''}"
        title="${esc(s.k)} — ${cm(s.n)} visits, ${w.toFixed(1)}% of all visits (${esc(s.g)})">
        ${w > 8 ? `<span class="seg-label" style="color:var(--${s.role}-on)">${w.toFixed(0)}%</span>` : ''}
      </div>`; }).join('')}</div>
    <div class="ribbon-key">${segs.map(s => `
      <span><i style="${fill(s)}"></i>${esc(s.k)} · ${cm(s.n)}</span>`).join('')}</div>
    <div class="ribbon-cap">Every one of the ${cm(total)} visits logged in this range, in proportion.
      Green booked an order. Everything to its right is a visit the field force made and recorded a reason
      for leaving empty-handed — ${legend(segs)}.</div>
  </div>`;
}

/* Describe only the colours actually on screen. Which reasons make the top seven
   varies with the data, so a fixed sentence eventually names a colour that isn't
   there — it previously explained "blue" in a range with no company-side reason. */
function legend(segs){
  const gloss = {
    loss:'rust is a problem at the shop',
    cool:'blue is ours to fix (company, distributor or product)',
    warn:'amber is a competitor',
    neut:'grey is unexplained'
  };
  const present = ROLE_ORDER.filter(r => r !== 'gain' && segs.some(s => s.role === r));
  const parts = present.map(r => gloss[r]);
  return parts.length > 1
    ? parts.slice(0,-1).join(', ') + ' and ' + parts[parts.length-1]
    : (parts[0] || 'each colour is a reason category');
}

/* ---------------- tabs ---------------- */
/* fourth entry gates the tab on its source export being present */
const TABS = [
  ['overview','Overview', tabOverview],
  ['people','People', tabPeople],
  ['conversion','Conversion', tabConversion],
  ['coverage','Coverage', tabCoverage],
  ['category','Category × Region', tabCategory],
  ['assortment','Assortment', tabAssortment, 'assortment'],
  ['distributors','Distributors', tabDistributors, 'distributors'],
  ['outlets','Outlets at risk', tabRFM, 'rfm'],
  ['notes','Data notes', tabNotes],
].filter(t => !t[3] || D[t[3]]);

/* One icon per section, keyed by tab id. Same 24-grid, 1.7 stroke and round caps
   as the theme toggle, so the rail reads as one set. They are decorative — the
   label carries the meaning, and in the collapsed rail the label survives as the
   button's title and aria-label. */
const ICON = (d, extra) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
  stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}${extra||''}</svg>`;
const TAB_ICON = {
  overview:    ICON('<rect x="3.2" y="3.2" width="7.2" height="7.2" rx="1.6"/><rect x="13.6" y="3.2" width="7.2" height="7.2" rx="1.6"/><rect x="3.2" y="13.6" width="7.2" height="7.2" rx="1.6"/><rect x="13.6" y="13.6" width="7.2" height="7.2" rx="1.6"/>'),
  people:      ICON('<circle cx="9" cy="8" r="3.2"/><path d="M2.8 20a6.2 6.2 0 0 1 12.4 0"/><path d="M16.4 5.2a3.2 3.2 0 0 1 0 5.9"/><path d="M18 14.4a6.2 6.2 0 0 1 3.2 5.6"/>'),
  conversion:  ICON('<path d="M3.2 4.6h17.6l-6.9 8.1V20l-3.8-2.4v-4.9z"/>'),
  coverage:    ICON('<path d="M12 21s6.8-5.6 6.8-11a6.8 6.8 0 1 0-13.6 0c0 5.4 6.8 11 6.8 11z"/><circle cx="12" cy="10" r="2.4"/>'),
  category:    ICON('<rect x="3.2" y="3.6" width="17.6" height="16.8" rx="2"/><path d="M3.2 9.2h17.6M9.4 9.2v11.2M15.2 9.2v11.2"/>'),
  assortment:  ICON('<path d="M12 2.9 21 7.4 12 12 3 7.4z"/><path d="m3 12.2 9 4.5 9-4.5"/><path d="m3 16.8 9 4.5 9-4.5"/>'),
  distributors:ICON('<path d="M2.8 6.4h10.4v9.2H2.8z"/><path d="M13.2 9.6h4l3 3.2v2.8h-7z"/><circle cx="6.6" cy="18" r="1.9"/><circle cx="17.2" cy="18" r="1.9"/>'),
  outlets:     ICON('<path d="M12 3.6 22 20H2z"/><path d="M12 9.6v4.6"/><path d="M12 17.2h.01"/>'),
  notes:       ICON('<path d="M13.6 2.9H6.4a1.8 1.8 0 0 0-1.8 1.8v14.6a1.8 1.8 0 0 0 1.8 1.8h11.2a1.8 1.8 0 0 0 1.8-1.8V8.5z"/><path d="M13.6 2.9V8.5h5.6"/><path d="M8.6 13.4h6.8M8.6 17h4.4"/>'),
};

/* ---------------- outlets at risk (RFM) ---------------- */
const SEG_ROLE = {'Active':'gain', 'New':'cool', 'At risk':'warn', 'Churned':'loss'};

function tabRFM(){
  const r = D.rfm, b = r.bands;
  const seg = n => r.segments.find(s => s.seg === n) || {n:0, net:0, pct:0};
  const churn = seg('Churned'), risk = seg('At risk');

  let h = `<section>
    <div class="grid g4" style="margin-bottom:12px">
      ${kpi('Churned outlets', cm(churn.n), '', `bought, then went quiet for ${b.risk}+ days`, true)}
      ${kpi('Value gone quiet', '₹'+inr(churn.net), '', `${pc(churn.share_net)} of billing in this export`)}
      ${kpi('At risk', cm(risk.n), '', `last order ${b.active}–${b.risk} days ago · ₹${inr(risk.net)}`)}
      ${kpi('Outlets billing again', pc(r.repeat_pct), '', `more than one billed visit`)}
    </div>
    <div class="callout w"><b>Scope.</b> This tab is built from the line-level Product
      Performance export, which covers ${cm(r.reps)} reps${r.scope_net_pct ?
      ` and ${pc(r.scope_net_pct)} of national billed value` : ''} — not the full field
      force. An outlet last served by a rep outside that export will look quieter here
      than it is. Recency is measured from <b>${r.as_of}</b>, the last date in the file,
      not from today.</div>
  </section>`;

  h += `<section><div class="shead"><h2>Where the outlet base sits</h2>
      <span class="note">${cm(r.outlets)} outlets that bought at least once, by how
      recently they last ordered</span></div>
    <div class="segs">${r.segments.map(s => `
      <div class="seg-chip"><i style="background:var(--${SEG_ROLE[s.seg]})"></i>
        <div><b>${cm(s.n)}</b><span class="t">${s.seg} · ₹${inr(s.net)} · ${pc(s.pct)}</span></div>
      </div>`).join('')}</div>
    <div class="sm" style="margin-top:11px">Active means an order inside ${b.active} days.
      New means the outlet first bought inside that same window, so it has no lapse to
      judge yet. At risk is ${b.active}–${b.risk} days. Churned is more than ${b.risk} —
      roughly two missed reorder cycles.</div>
  </section>`;

  h += `<section><div class="shead"><h2>Lapsed base by rep</h2>
      <span class="note">who is carrying the most dormant value</span></div>
    ${ftable('rrep', {
      rows: r.by_rep,
      limit: 40,
      sort: {key:'lapsed_net', dir:'desc'},
      filters: [{id:'q', label:'Find', key:'rep', type:'search', ph:'rep name'}],
      cols: [
        {t:'Rep', key:'rep', nm:true},
        {t:'Outlets', key:'outlets', n:true, fmt:v=>cm(v)},
        {t:'Active', key:'active', n:true, fmt:v=>cm(v)},
        {t:'At risk', key:'risk', n:true, fmt:v=>cm(v)},
        {t:'Churned', key:'churned', n:true, fmt:v=>cm(v)},
        {t:'Lapsed', key:'lapsed_pct', n:true,
         fmt:v=>`<span class="pill ${v>=70?'l':v>=50?'w':''}">${pc(v)}</span>`},
        {t:'Dormant value', key:'lapsed_net', n:true, fmt:v=>'₹'+inr(v)},
      ]})}
  </section>`;

  h += `<section><div class="shead"><h2>The call list</h2>

function tabOverview(){
  const k = D.kpis;
  let h = `<section>
    <div class="grid g5" style="margin-bottom:12px">
      ${kpi('Net secondary sales', '₹'+inr(k.net), '', `${cm(k.pc)} orders · ₹${cm(k.avg_order)} average`, true, trend('net'))}
      ${kpi('Visits logged', cm(k.tc), '', `${k.visits_per_day} per field day`, false, trend('tc'))}
      ${kpi('Visits that converted', pc(k.conv), '', `${cm(k.pc)} of ${cm(k.tc)}`, false, trend('conv', {pp:true}))}
      ${kpi('Sales per field day', '₹'+cm(k.sales_per_day), '', `across ${cm(k.present_days)} days worked`, false, trend('spd'))}
      ${kpi('Lines per order', k.lines_per_pc, '', `${cm(k.lines)} lines sold`)}
    </div>
    ${TREND && TREND.partial.length ? `<div class="sm" style="margin:-4px 0 12px">
      Arrows compare the last two complete months. ${TREND.partial.join(', ')} is a
      part month in this pull and is excluded from the comparison, though its totals
      are included in the figures above.</div>` : ''}
    ${ribbon()}
  </section>`;

  h += `<section><div class="shead"><h2>The quarter in three numbers</h2></div>
    <div class="grid g3">
      <div class="card"><div class="stat-row"><div><b>${cm(k.outlets)}</b>outlets on the master</div></div>
        <div class="sm" style="margin-top:9px">${cm(k.outlets_visited)} were visited (${pc(k.coverage_pct)}).
        Only <b>${cm(k.outlets_ordered)}</b> placed an order — ${pc(k.billed_pct)} of the universe.</div></div>
      <div class="card"><div class="stat-row"><div><b>${cm(D.people.active)}</b>active users on roll</div></div>
        <div class="sm" style="margin-top:9px">Of ${cm(D.people.field)} field users, <b>${D.people.idle}</b> logged
        no calls at all in this range.</div></div>
      <div class="card"><div class="stat-row"><div><b>${cm(D.outlets.beats_zero)}</b>beats sold nothing</div></div>
        <div class="sm" style="margin-top:9px">Out of ${cm(D.outlets.beats_total)} beats carrying sales activity
        between April and mid-August.</div></div>
    </div></section>`;

  const m = D.monthly;
  h += `<section><div class="shead"><h2>Month by month</h2>
    <span class="note">Volume is climbing. The conversion rate is not.</span></div>
    ${table([{t:'Month'},{t:'Visits',n:1},{t:'Orders',n:1},{t:'Conversion',n:1},
             {t:'Net sales',n:1},{t:'Reps active',n:1},{t:'Visits / day',n:1},{t:'Sales / day',n:1}],
      m.map(r => [r.month, cm(r.tc), cm(r.pc),
        `<span class="pill ${r.conv>=15?'g':'l'}">${pc(r.conv)}</span>`,
        '₹'+inr(r.net), cm(r.users), r.vpd, '₹'+cm(r.spd)]))}
  </section>`;

  // last full month is the last entry with volume comparable to earlier months
  // August is partial (mid-month) so pick the last non-partial month by finding the
  // last entry whose TC is at least half of the previous month
  let lastFull = m.length - 1;
  while (lastFull > 0 && m[lastFull].tc < m[lastFull-1].tc * 0.7) lastFull--;
  const base = m[0], last = m[lastFull];
  const partialNote = lastFull < m.length - 1
    ? ` <span class="sm">(August is a partial month and excluded from the trend calc.)</span>` : '';
  h += `<section><div class="shead"><h2>Headline read</h2></div>
    <div class="grid g2">
      <div class="callout"><b>Six in seven visits end without an order.</b> Conversion was
        ${pc(base.conv)} in ${base.month} and ${pc(last.conv)} in ${last.month}. Visits rose
        ${Math.round((last.tc/base.tc-1)*100)}% across the range and sales rose
        ${Math.round((last.net/base.net-1)*100)}% — the team is working harder at close to
        the same strike rate.${partialNote}</div>
      <div class="callout w"><b>Reach is wide, depth is thin.</b> The field touched
        ${pc(k.coverage_pct)} of the outlet base but billed ${pc(k.billed_pct)}. The gap between
        those two numbers — ${cm(k.outlets_visited - k.outlets_ordered)} outlets visited but never
        billed — is the single largest addressable pool in this data.</div>
    </div></section>`;
  return h;
}

  if (D.hierarchy){
    const hy = D.hierarchy;
    const mapped = hy.managers.filter(m => m.name !== 'Unmapped');
    h += `<section><div class="shead"><h2>Manager scorecard</h2>
      <span class="note">Reps rolled up to the L2 they report to · ${cm(hy.mapped_reps)} of
      ${cm(hy.mapped_reps + hy.unmapped_reps)} reps carry a manager in the export</span></div>
      ${hy.unmapped_reps ? `<div class="callout w" style="margin-bottom:12px">
        <b>${cm(hy.unmapped_reps)} reps sit outside this rollup.</b> The Product Performance export was pulled
        with a position filter, so only ${cm(hy.mapped_reps)} reps carry an L2 name. Those unmapped reps hold
        ₹${inr((hy.managers.find(m => m.name === 'Unmapped')||{net:0}).net)} of booked value — the line below is
        real but it is not yet the whole field force. Re-pull the report with no filter to close this.</div>` : ''}
      ${ftable('mgr', {
        rows: hy.managers,
        sort: {key:'net', dir:'desc'},
        cols: [{t:'Manager', key:'name', nm:1, sort:false,
                fmt:v => v === 'Unmapped' ? `<span class="sm">${esc(v)}</span>` : esc(v)},
               {t:'Reps', key:'reps', n:1, fmt:v => cm(v)},
               {t:'Visits', key:'tc', n:1, fmt:v => cm(v)},
               {t:'Orders', key:'pc', n:1, fmt:v => cm(v)},
               {t:'Conv.', key:'conv', n:1,
                fmt:v => `<span class="pill ${v>=16?'g':v>=12?'w':'l'}">${pc(v)}</span>`},
               {t:'Net sales', key:'net', n:1, fmt:v => '₹'+inr(v)},
               {t:'Avg order', key:'avg_order', n:1, fmt:v => '₹'+cm(v)},
               {t:'Visits/day', key:'vpd', n:1},
               {t:'Sales/day', key:'spd', n:1, fmt:v => '₹'+cm(v)},
               {t:'Outlets', key:'outlets', n:1, fmt:v => cm(v)},
               {t:'SKUs sold', key:'skus', n:1, fmt:v => v ? cm(v) : '—'}],
        filters: [{id:'q', label:'Find', key:'name', type:'search', ph:'manager name'}],
      })}
      ${(() => {
        // a manager running a handful of visits produces a meaningless rate — hold the
        // spread callout to teams with enough volume for the number to mean something
        const soak = mapped.filter(m => m.tc >= 500);
        if (soak.length < 2) return '';
        const lo = soak.reduce((a,b) => b.conv < a.conv ? b : a);
        const hi = soak.reduce((a,b) => b.conv > a.conv ? b : a);
        return `<div class="callout" style="margin-top:12px">
          <b>Conversion runs from ${pc(lo.conv)} to ${pc(hi.conv)} between managers</b> — ${esc(hi.name)}
          converts ${(hi.conv/lo.conv).toFixed(1)}× what ${esc(lo.name)} does, on the same product range and
          the same app. Across the ${cm(soak.length)} managers running 500 visits or more, that spread is the
          most controllable number in this dashboard: it is a coaching gap before it is a market gap.</div>`;
      })()}
    </section>`;
  }

  if (p.idle_names.length){
    h += `<section><div class="shead"><h2>Active field users with no calls in this range</h2>

  return h;
}

const nav = document.getElementById('nav'), main = document.getElementById('main');
TABS.forEach(([id, label], i) => {
  const b = el('button', null, (TAB_ICON[id]||'') + `<span class="lbl">${esc(label)}</span>`);
  b.setAttribute('role','tab'); b.setAttribute('aria-selected', i===0);
  b.setAttribute('aria-controls', 'p-'+id);
  /* the label is hidden in the collapsed rail, so keep it reachable both ways */
  b.setAttribute('title', label);
  b.setAttribute('aria-label', label);
  b.tabIndex = i === 0 ? 0 : -1;
  b.onclick = () => show(id);
  nav.appendChild(b);
  const p = el('div', 'panel'); p.id = 'p-'+id; p.setAttribute('role','tabpanel');
  p.setAttribute('aria-label', label);
  if (i) p.hidden = true;
  main.appendChild(p);
});

/* A vertical tablist is driven with up/down; home/end jump the ends. Without
   this the sidebar would be nine separate tab stops instead of one. */
nav.addEventListener('keydown', e => {
  const keys = {ArrowDown:1, ArrowUp:-1, Home:'first', End:'last'};
  if (!(e.key in keys)) return;
  e.preventDefault();
  const btns = [...nav.children], at = btns.indexOf(document.activeElement);
  const step = keys[e.key];
  const next = step === 'first' ? 0 : step === 'last' ? btns.length-1
             : (at + step + btns.length) % btns.length;
  btns[next].focus();
  show(TABS[next][0]);
});

const built = {};
let CURRENT_TAB = TABS[0][0];
function show(id, opts){
  if (!TABS.some(t => t[0] === id)) id = TABS[0][0];
  CURRENT_TAB = id;
  TABS.forEach(([tid,,fn], i) => {
    const on = tid === id;
    nav.children[i].setAttribute('aria-selected', on);
    nav.children[i].tabIndex = on ? 0 : -1;
    const p = document.getElementById('p-'+tid);
    p.hidden = !on;
    if (on && !built[tid]) {
      p.innerHTML = fn(); built[tid] = 1;
      /* wire every table declared so far — a tab may render several */
      Object.keys(FT).forEach(ftableWire);
    }
  });
  writeHash(id);
  if (!(opts && opts.keepScroll)) window.scrollTo({top:0, behavior:'instant'});
}

/* ---------------- deep links ----------------
   #tab=outlets&zone=West&seg=Churned — the tab plus whichever shared filters are
   set. Applying the filters BEFORE the tab renders means the table draws filtered
   once, rather than drawing everything and then visibly re-filtering.         */
function applyHash(opts){
  const q = readHash();
  /* The hash carries the entire shared state, so a key absent from it is
     CLEARED, not left alone. Merging instead would let a link like
     "#tab=outlets" inherit whatever filter the recipient already had set, and
     the page they opened would not be the page the sender was looking at. */
  STICKY_KEYS.forEach(k => { STICKY[k] = q[k] || ''; });
  show(q.tab || TABS[0][0], opts);
  /* tables built on an earlier visit need pushing to the new values */
  syncSticky();
}
applyHash();
/* back/forward, or a pasted link into an already-open page */
window.addEventListener('hashchange', () => { if (!HASH_LOCK) applyHash({keepScroll:true}); });

/* ---------------- theme toggle ----------------
   No stored choice means "follow the OS", so the first click flips away from
   whatever the OS is currently showing rather than from a hardcoded default.
   Every colour is a CSS custom property, so the swap needs no re-render.
   Two buttons exist — sidebar and narrow-screen top bar — and only one is ever
   visible, but both are kept in sync so neither can report a stale state.    */
(function(){
  const root = document.documentElement;
  const btns = [...document.querySelectorAll('.theme-btn')];
  if (!btns.length) return;
  const icons = document.getElementById('themeIcons');
  if (icons) btns.forEach(b => b.appendChild(icons.content.cloneNode(true)));
  /* matchMedia is missing in some headless/embedded engines; without this guard
     an unimplemented API takes the whole toggle down rather than degrading it */
  const osDark = window.matchMedia
    ? window.matchMedia('(prefers-color-scheme: dark)')
    : {matches:false, addEventListener(){}};
  const effective = () => root.getAttribute('data-theme') || (osDark.matches ? 'dark' : 'light');
  const label = () => btns.forEach(b => b.setAttribute('aria-label',
    effective() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'));
  btns.forEach(b => b.onclick = () => {
    const next = effective() === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('frido-theme', next); } catch(e){}
    label();
  });
  /* while the viewer is still on "follow the OS", track OS changes live */
  osDark.addEventListener('change', label);
  label();
})();

/* ---------------- sidebar: rail collapse and narrow-screen drawer ----------------
   Two separate states on purpose. "rail" is a desktop preference and is
   remembered; "drawer" is a transient narrow-screen overlay and is not, because
   a drawer that reopened itself on every load would be a bug, not a memory.   */
(function(){
  const root = document.documentElement;
  const side = document.getElementById('side');
  const collapse = document.getElementById('collapseBtn');
  const drawerBtn = document.getElementById('drawerBtn');
  const scrim = document.getElementById('scrim');

  try {
    if (localStorage.getItem('frido-side') === 'rail') root.setAttribute('data-side','rail');
  } catch(e){}
  const railed = () => root.getAttribute('data-side') === 'rail';
  const markCollapse = () => collapse && collapse.setAttribute('aria-label',
    railed() ? 'Expand the sidebar' : 'Collapse the sidebar');
  if (collapse) collapse.onclick = () => {
    const next = railed() ? '' : 'rail';
    if (next) root.setAttribute('data-side', next); else root.removeAttribute('data-side');
    try { localStorage.setItem('frido-side', next || 'full'); } catch(e){}
    markCollapse();
  };
  markCollapse();

  function drawer(open){
    if (open) root.setAttribute('data-drawer','open'); else root.removeAttribute('data-drawer');
    if (scrim) scrim.hidden = !open;
    if (drawerBtn) drawerBtn.setAttribute('aria-expanded', String(!!open));
    if (open && side) side.querySelector('nav button[aria-selected="true"]')?.focus();
  }
  if (drawerBtn) drawerBtn.onclick = () => drawer(root.getAttribute('data-drawer') !== 'open');
  if (scrim) scrim.onclick = () => drawer(false);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') drawer(false); });
  /* picking a section is the end of the drawer's job */
  if (side) side.addEventListener('click', e => {
    if (e.target.closest('nav button')) drawer(false);
  });
  /* leaving narrow width must not strand the overlay state */
  if (window.matchMedia) {
    const wide = window.matchMedia('(min-width:861px)');
    wide.addEventListener('change', e => { if (e.matches) drawer(false); });
  }
})();

/* the sidebar footer states the window the data covers */
(function(){
  const el = document.getElementById('asof');
  if (el) el.textContent = (D.rfm && D.rfm.as_of) ? 'to ' + D.rfm.as_of : D.kpis.quarter;
})();
</script>
